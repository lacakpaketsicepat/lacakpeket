<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lacak Paket SiCepat</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px 14px;
    font-family: Arial, sans-serif;
    background: #080808;
    color: #fff;
}

.header {
    text-align: center;
    padding: 20px 10px;
}

.header h2 {
    margin: 0 0 8px;
    font-size: 23px;
}

.header p {
    color: #aaa;
    font-size: 13px;
}

.container {
    max-width: 650px;
    margin: auto;
}

.form-box, .result-box {
    background: #151515;
    border: 1px solid #333;
    border-radius: 17px;
    padding: 20px;
    margin-bottom: 18px;
}

label {
    display: block;
    margin-bottom: 10px;
    color: #ccc;
    font-size: 15px;
}

select, textarea {
    width: 100%;
    background: #080808;
    border: 1px solid #444;
    border-radius: 12px;
    color: white;
    padding: 14px;
    font-size: 16px;
    margin-bottom: 20px;
}

textarea {
    height: 130px;
    resize: vertical;
}

button {
    width: 100%;
    padding: 16px;
    border: none;
    border-radius: 12px;
    background: white;
    color: black;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

button:disabled {
    opacity: 0.6;
}

.result-box {
    display: none;
}

.package {
    border: 1px solid #383838;
    border-radius: 15px;
    padding: 17px;
    margin-bottom: 15px;
}

.package h3 {
    font-size: 17px;
    margin: 0 0 18px;
}

.info {
    margin-bottom: 15px;
}

.info-label {
    color: #999;
    font-size: 14px;
    margin-bottom: 5px;
}

.info-value {
    color: white;
    font-size: 16px;
    overflow-wrap: anywhere;
}

.history-btn {
    margin-top: 8px;
    background: #292929;
    color: white;
    font-size: 14px;
}

.history {
    display: none;
    margin-top: 18px;
    border-left: 3px solid #888;
    padding-left: 13px;
}

.history-item {
    margin-bottom: 16px;
    color: #ccc;
    font-size: 14px;
    line-height: 1.5;
}

.history-date {
    color: white;
    font-weight: bold;
    margin-bottom: 5px;
}

.error {
    color: #ff8585;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #777;
    font-size: 13px;
    margin: 35px 0 15px;
}
</style></head><body><div class="container"><div class="header">
    <h2>LACAK PAKET</h2>
    <p>Pelacakan Paket SiCepat Express</p>
</div>

<div class="form-box">

    <label>Ekspedisi</label>
    <select id="courier">
        <option value="sicepat">SiCepat Express</option>
    </select>

    <label>Masukkan Nomor Resi</label>
    <textarea id="resi" placeholder="Masukkan nomor resi, satu resi setiap baris"></textarea>

    <p style="color:#999;font-size:13px;margin-top:-10px;margin-bottom:18px;">
        Maksimal 55 nomor resi. Pisahkan setiap resi dengan baris baru.
    </p>

    <button id="trackButton" onclick="trackPackages()">LACAK PAKET</button>

</div>

<div class="result-box" id="results"></div>

<div class="footer">
    Pelacakan Paket SiCepat Express
</div>

</div><script>
const WORKER_URL = "https://anddo2336.workers.dev";

function getValue(value) {
    if (value === null || value === undefined || value === "") {
        return "-";
    }
    return value;
}

function createPackageCard(data, resi, index) {
    const summary = data.summary || {};
    const detail = data.detail || {};
    const history = Array.isArray(data.history) ? data.history : [];

    const penerima = getValue(detail.receiver);
    const alamat = getValue(detail.destination);
    const nomorResi = getValue(summary.awb || resi);
    const seller = getValue(detail.shipper);
    const status = getValue(summary.status);

    let historyHTML = "";

    if (history.length > 0) {
        historyHTML = history.map(item => `
            <div class="history-item">
                <div class="history-date">${escapeHTML(getValue(item.date))}</div>
                <div>${escapeHTML(getValue(item.desc))}</div>
                ${item.location ? `<div>${escapeHTML(item.location)}</div>` : ""}
            </div>
        `).join("");
    } else {
        historyHTML = '<div class="history-item">Riwayat perjalanan belum tersedia.</div>';
    }

    return `
        <div class="package">
            <h3>DETAIL PAKET #${index}</h3>

            <div class="info">
                <div class="info-label">Nama Penerima</div>
                <div class="info-value">${escapeHTML(penerima)}</div>
            </div>

            <div class="info">
                <div class="info-label">Alamat penerima</div>
                <div class="info-value">${escapeHTML(alamat)}</div>
            </div>

            <div class="info">
                <div class="info-label">No resi</div>
                <div class="info-value">${escapeHTML(nomorResi)}</div>
            </div>

            <div class="info">
                <div class="info-label">Seller</div>
                <div class="info-value">${escapeHTML(seller)}</div>
            </div>

            <div class="info">
                <div class="info-label">Status</div>
                <div class="info-value">${escapeHTML(status)}</div>
            </div>

            <button class="history-btn" onclick="toggleHistory(this)">
                LIHAT RIWAYAT PERJALANAN
            </button>

            <div class="history">
                ${historyHTML}
            </div>
        </div>
    `;
}

function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, function(char) {
        return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
        }[char];
    });
}

function toggleHistory(button) {
    const history = button.nextElementSibling;

    if (history.style.display === "block") {
        history.style.display = "none";
        button.textContent = "LIHAT RIWAYAT PERJALANAN";
    } else {
        history.style.display = "block";
        button.textContent = "SEMBUNYIKAN RIWAYAT";
    }
}

async function trackPackages() {
    const input = document.getElementById("resi").value;

    const resiList = [...new Set(
        input.split(/[\n,;]+/)
        .map(item => item.trim())
        .filter(Boolean)
    )];

    const results = document.getElementById("results");
    const button = document.getElementById("trackButton");

    if (resiList.length === 0) {
        alert("Masukkan nomor resi terlebih dahulu.");
        return;
    }

    if (resiList.length > 55) {
        alert("Maksimal 55 nomor resi.");
        return;
    }

    results.style.display = "block";
    results.innerHTML = "";
    button.disabled = true;
    button.textContent = "SEDANG MELACAK...";

    for (let i = 0; i < resiList.length; i++) {
        const resi = resiList[i];

        const card = document.createElement("div");
        card.className = "package";
        card.innerHTML = `
            <h3>DETAIL PAKET #${i + 1}</h3>
            <div class="info-value">No resi: ${escapeHTML(resi)}</div>
            <p style="color:#aaa">Sedang mengambil data...</p>
        `;

        results.appendChild(card);

        try {
            const response = await fetch(
                `${WORKER_URL}/api/track?resi=${encodeURIComponent(resi)}`
            );

            if (!response.ok) {
                throw new Error("Server memberikan respons " + response.status);
            }

            const json = await response.json();

            if (!json.data || !json.data.summary) {
                throw new Error(json.message || "Data pelacakan tidak ditemukan.");
            }

            card.outerHTML = createPackageCard(json.data, resi, i + 1);

        } catch (error) {
            card.innerHTML = `
                <h3>DETAIL PAKET #${i + 1}</h3>
                <div class="info">
                    <div class="info-label">No resi</div>
                    <div class="info-value">${escapeHTML(resi)}</div>
                </div>
                <div class="error">Gagal: ${escapeHTML(error.message)}</div>
            `;
        }
    }

    button.disabled = false;
    button.textContent = "LACAK PAKET";
}
</script></body>
</html>
