<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lacak Paket SiCepat</title><style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#080808;
 color:#fff;
}
.header{
 background:#111;
 border-bottom:1px solid #292929;
 padding:23px 15px;
 text-align:center;
}
.header h2{margin:0;font-size:21px}
.header p{color:#aaa;font-size:12px;margin:7px 0 0}
.container{max-width:650px;margin:22px auto;padding:0 13px}
.box{
 background:#151515;
 border:1px solid #292929;
 border-radius:12px;
 padding:17px;
 margin-bottom:16px;
}
label{display:block;font-size:13px;margin-bottom:9px;color:#ddd}
select,textarea{
 width:100%;
 background:#090909;
 border:1px solid #393939;
 border-radius:8px;
 color:white;
 padding:13px;
 font-size:14px;
 outline:none;
}
select{height:45px;margin-bottom:17px}
textarea{height:135px;resize:vertical}
button{
 width:100%;
 padding:13px;
 border:0;
 border-radius:8px;
 background:#fff;
 color:#000;
 font-weight:bold;
 font-size:14px;
 margin-top:14px;
 cursor:pointer;
}
button:disabled{opacity:.5}
.info{font-size:11px;color:#999;margin-top:9px}
.card{
 background:#151515;
 border:1px solid #303030;
 border-radius:11px;
 padding:15px;
 margin-bottom:12px;
}
.card h3{font-size:14px;margin:0 0 14px}
.row{
 display:flex;
 justify-content:space-between;
 gap:12px;
 padding:9px 0;
 border-bottom:1px solid #292929;
 font-size:12px;
}
.row span:first-child{color:#999;min-width:100px}
.row span:last-child{text-align:right;overflow-wrap:anywhere}
.status{color:#9be7a5}
.history{
 margin-top:13px;
 background:#222;
 color:white;
 padding:10px;
 border-radius:7px;
 font-size:12px;
}
.history-list{
 display:none;
 padding:12px 5px 0;
 font-size:12px;
 color:#ccc;
}
.history-item{
 border-left:2px solid #888;
 padding:0 0 14px 12px;
 margin-left:5px;
}
.history-item b{color:white;display:block;margin-bottom:5px}
.loading,.error{font-size:12px;color:#bbb;padding:8px 0}
.footer{text-align:center;color:#666;font-size:11px;padding:20px}
</style></head><body><div class="header">
 <h2>LACAK PAKET</h2>
 <p>Tracking Pengiriman SiCepat Express</p>
</div><div class="container">
 <div class="box">
  <label>Ekspedisi</label>
  <select id="courier">
   <option value="sicepat">SiCepat Express</option>
  </select><label>Masukkan Nomor Resi</label>

  <textarea id="resi" placeholder="Masukkan nomor resi, satu resi setiap baris..."></textarea>  <div class="info">Maksimal 55 nomor resi. Pisahkan setiap resi dengan baris baru.</div>
  <button id="trackBtn" onclick="lacak()">LACAK PAKET</button>
 </div> <div id="results"></div>
</div><div class="footer">Pelacakan Paket SiCepat Express</div><script>
const WORKER_URL = "https://lacakpeket.anddo2336.workers.dev";

function ambil(obj, keys, fallback="-"){
 for(const key of keys){
  if(obj && obj[key] !== undefined && obj[key] !== null && obj[key] !== ""){
   return obj[key];
  }
 }
 return fallback;
}

function aman(value){
 return String(value ?? "-").replace(/[&<>"']/g, c => ({
 "&":"&amp;",
 "<":"&lt;",
 ">":"&gt;",
 '"':"&quot;",
 "'":"&#39;"
 })[c]);
}

function buatBaris(label,value){
 return `<div class="row"><span>${label}</span><span>${value}</span></div>`;
}

function tampilkan(data,resi,index){
 const root = data.data || data;
 const summary = root.summary || {};
 const detail = root.detail || {};
 const history = root.history || root.manifest || [];

 const penerima = ambil(summary,["receiver","receiver_name","consignee"],
                 ambil(detail,["receiver","receiver_name","consignee"]));

 const alamat = ambil(summary,["destination_address","receiver_address","address"],
               ambil(detail,["destination_address","receiver_address","address"]));

 const nomor = ambil(summary,["awb","waybill","resi"],resi);

 const seller = ambil(summary,["shipper","shipper_name","sender"],
               ambil(detail,["shipper","shipper_name","sender"]));

 const status = ambil(summary,["status","status_desc","desc"],
                ambil(detail,["status","status_desc"]));

 let riwayat = "";

 if(Array.isArray(history) && history.length){
  riwayat = history.map(item => `
   <div class="history-item">
    <b>${aman(ambil(item,["date","datetime","time"]))}</b>
    ${aman(ambil(item,["desc","description","status"]))}
    <br>${aman(ambil(item,["location","city"]))}
   </div>
  `).join("");
 }else{
  riwayat = '<div class="loading">Riwayat perjalanan belum tersedia.</div>';
 }

 return `
 <div class="card">
  <h3>DETAIL PAKET #${index}</h3>
  ${buatBaris("Nama Penerima",aman(penerima))}
  ${buatBaris("Alamat",aman(alamat))}
  ${buatBaris("No Resi",aman(nomor))}
  ${buatBaris("Seller",aman(seller))}
  ${buatBaris("Status",`<span class="status">${aman(status)}</span>`)}
  <button class="history" onclick="toggleHistory(this)">LIHAT RIWAYAT PERJALANAN</button>
  <div class="history-list">${riwayat}</div>
 </div>`;
}

function toggleHistory(button){
 const list = button.nextElementSibling;
 list.style.display = list.style.display === "block" ? "none" : "block";
}

async function lacakSatu(resi,index){
 const target = document.getElementById("result-"+index);

 try{
  const url = WORKER_URL.replace(/\/$/,"") +
   "/api/track?resi="+encodeURIComponent(resi);

  const response = await fetch(url);
  const json = await response.json();

  if(!response.ok || json.success === false){
   throw new Error(json.message || "Gagal melacak paket");
  }

  target.innerHTML = tampilkan(json,resi,index);

 }catch(error){
  target.innerHTML = `
   <div class="card">
    <h3>DETAIL PAKET #${index}</h3>
    ${buatBaris("No Resi",aman(resi))}
    <div class="error">Gagal: ${aman(error.message)}</div>
   </div>`;
 }
}

async function lacak(){
 const input = document.getElementById("resi").value;

 const resis = [...new Set(input.split(/[\n,;]+/)
  .map(x=>x.trim()).filter(Boolean))];

 const results = document.getElementById("results");
 const button = document.getElementById("trackBtn");

 if(!resis.length){
  alert("Masukkan nomor resi terlebih dahulu.");
  return;
 }

 if(resis.length > 55){
  alert("Maksimal 55 nomor resi.");
  return;
 }

 button.disabled = true;
 button.textContent = "SEDANG MELACAK...";

 results.innerHTML = resis.map((resi,i)=>
  `<div id="result-${i+1}" class="card">
   <h3>DETAIL PAKET #${i+1}</h3>
   <div class="loading">Sedang melacak ${aman(resi)}...</div>
  </div>`
 ).join("");

 try{
  for(let i=0;i<resis.length;i++){
   await lacakSatu(resis[i],i+1);
  }
 }finally{
  button.disabled = false;
  button.textContent = "LACAK PAKET";
 }
}
</script></body>
</html>
