<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lacak Paket SiCepat</title><style>
*{box-sizing:border-box}

body{
    margin:0;
    padding:15px;
    background:#080808;
    color:#fff;
    font-family:Arial,sans-serif;
}

.container{
    max-width:650px;
    margin:auto;
}

.header{
    text-align:center;
    padding:22px 10px;
}

.header h2{
    margin:0;
    font-size:23px;
}

.header p{
    color:#999;
    font-size:13px;
}

.form-box,.package{
    background:#151515;
    border:1px solid #333;
    border-radius:13px;
    padding:18px;
    margin-bottom:15px;
}

label{
    display:block;
    color:#ccc;
    font-size:14px;
    margin-bottom:9px;
}

select,textarea{
    width:100%;
    background:#080808;
    border:1px solid #444;
    border-radius:9px;
    color:white;
    padding:13px;
    font-size:15px;
    margin-bottom:18px;
}

textarea{
    height:125px;
    resize:vertical;
}

.info{
    font-size:12px;
    color:#999;
    margin-top:-8px;
    margin-bottom:16px;
}

button{
    width:100%;
    padding:14px;
    border:0;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
}

.track-btn{
    background:white;
    color:black;
    font-size:15px;
}

.track-btn:disabled{
    opacity:.5;
}

.package h3{
    font-size:15px;
    margin:0 0 20px;
}

.info-item{
    margin-bottom:17px;
}

.info-label{
    font-size:13px;
    color:#999;
    margin-bottom:6px;
}

.info-value{
    font-size:15px;
    color:#fff;
    line-height:1.5;
    overflow-wrap:anywhere;
}

.status{
    color:#9be7a5;
    font-weight:bold;
}

.history-btn{
    background:#292929;
    color:white;
    font-size:13px;
    margin-top:5px;
}

.history{
    display:none;
    margin-top:18px;
}

.history-item{
    border-left:2px solid #888;
    padding:2px 0 15px 13px;
    margin-left:5px;
    color:#ccc;
    font-size:13px;
    line-height:1.5;
}

.history-date{
    color:white;
    font-weight:bold;
    margin-bottom:5px;
}

.loading{
    color:#aaa;
    font-size:13px;
}

.error{
    color:#ff8585;
    font-size:13px;
}

.footer{
    text-align:center;
    color:#666;
    font-size:12px;
    padding:25px 0;
}
</style></head><body><div class="container"><div class="header">
    <h2>LACAK PAKET</h2>
    <p>Pelacakan Paket SiCepat Express</p>
</div>

<div class="form-box">

    <label>Ekspedisi</label>
    <select id="courier">
        <option value="sicepat">SiCepat Express</option>
    </select>

    <label>Masukkan Nomor Resi</label>
    <textarea id="resi" placeholder="Masukkan nomor resi, satu resi setiap baris"></textarea>

    <div class="info">
        Maksimal 55 nomor resi sekaligus.
    </div>

    <button class="track-btn" id="trackBtn" onclick="trackPackages()">
        LACAK PAKET
    </button>

</div>

<div id="results"></div>

<div class="footer">
    Pelacakan Paket SiCepat Express
</div>

</div><script>
const WORKER_URL = "https://lacakpeket.anddo2336.workers.dev";

function escapeHTML(value){
    return String(value ?? "-").replace(/[&<>"']/g, char => ({
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
    })[char]);
}

function getValue(objects, keys, fallback="-"){
    for(const obj of objects){
        if(!obj || typeof obj !== "object") continue;

        for(const key of keys){
            const value = obj[key];

            if(value !== undefined && value !== null && value !== ""){
                return value;
            }
        }
    }

    return fallback;
}

function toggleHistory(button){
    const history = button.nextElementSibling;
    const open = history.style.display === "block";

    history.style.display = open ? "none" : "block";

    button.textContent = open
        ? "LIHAT RIWAYAT PERJALANAN"
        : "SEMBUNYIKAN RIWAYAT";
}

function createCard(json, resi, index){

    const data = json.data || {};
    const summary = data.summary || {};
    const detail = data.detail || {};

    const penerima = getValue(
        [detail, summary],
        ["receiver","receiver_name","consignee"]
    );

    const alamat = getValue(
        [detail, summary],
        ["destination","receiver_address","destination_address"]
    );

    const nomorResi = getValue(
        [summary, detail],
        ["awb","waybill","resi"],
        resi
    );

    const seller = getValue(
        [detail, summary],
        ["shipper","shipper_name","sender"]
    );

    const status = getValue(
        [summary, detail],
        ["status","status_desc"]
    );

    const history = Array.isArray(data.history)
        ? data.history
        : Array.isArray(data.manifest)
        ? data.manifest
        : [];

    let historyHTML = "";

    if(history.length){
        historyHTML = history.map(item => `
            <div class="history-item">
                <div class="history-date">
                    ${escapeHTML(getValue([item],["date","datetime","time"]))}
                </div>
                ${escapeHTML(getValue([item],["desc","description","status"]))}
                ${item.location ? "<br>"+escapeHTML(item.location) : ""}
            </div>
        `).join("");
    }else{
        historyHTML = '<div class="loading">Riwayat perjalanan belum tersedia.</div>';
    }

    return `
        <div class="package">

            <h3>DETAIL PAKET #${index}</h3>

            <div class="info-item">
                <div class="info-label">Nama Penerima</div>
                <div class="info-value">${escapeHTML(penerima)}</div>
            </div>

            <div class="info-item">
                <div class="info-label">Alamat penerima</div>
                <div class="info-value">${escapeHTML(alamat)}</div>
            </div>

            <div class="info-item">
                <div class="info-label">No resi</div>
                <div class="info-value">${escapeHTML(nomorResi)}</div>
            </div>

            <div class="info-item">
                <div class="info-label">Seller</div>
                <div class="info-value">${escapeHTML(seller)}</div>
            </div>

            <div class="info-item">
                <div class="info-label">Status</div>
                <div class="info-value status">${escapeHTML(status)}</div>
            </div>

            <button class="history-btn" onclick="toggleHistory(this)">
                LIHAT RIWAYAT PERJALANAN
            </button>

            <div class="history">
                ${historyHTML}
            </div>

        </div>
    `;
}

async function trackPackages(){

    const input = document.getElementById("resi").value;

    const resiList = [...new Set(
        input.split(/[\n,;]+/)
        .map(item => item.trim())
        .filter(Boolean)
    )];

    const results = document.getElementById("results");
    const button = document.getElementById("trackBtn");

    if(!resiList.length){
        alert("Masukkan nomor resi terlebih dahulu.");
        return;
    }

    if(resiList.length > 55){
        alert("Maksimal 55 nomor resi.");
        return;
    }

    button.disabled = true;
    button.textContent = "SEDANG MELACAK...";
    results.innerHTML = "";

    try{

        for(let i=0; i<resiList.length; i++){

            const resi = resiList[i];

            const card = document.createElement("div");
            card.className = "package";

            card.innerHTML = `
                <h3>DETAIL PAKET #${i+1}</h3>
                <div class="loading">Sedang mengambil data...</div>
            `;

            results.appendChild(card);

            try{

                const url = WORKER_URL +
                    "/api/track?resi=" + encodeURIComponent(resi);

                const response = await fetch(url);
                const json = await response.json();

                if(!response.ok || json.success === false || !json.data){
                    throw new Error(
                        json.message || "Data pelacakan tidak ditemukan"
                    );
                }

                card.outerHTML = createCard(json, resi, i+1);

            }catch(error){

                card.innerHTML = `
                    <h3>DETAIL PAKET #${i+1}</h3>

                    <div class="info-item">
                        <div class="info-label">No resi</div>
                        <div class="info-value">${escapeHTML(resi)}</div>
                    </div>

                    <div class="error">
                        Gagal: ${escapeHTML(error.message)}
                    </div>
                `;
            }
        }

    }finally{
        button.disabled = false;
        button.textContent = "LACAK PAKET";
    }
}
</script></body>
</html>
