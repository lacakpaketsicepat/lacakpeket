<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lacak Paket SiCepat</title><style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #080808;
    color: #f5f5f5;
    font-family: Arial, sans-serif;
}

.header {
    background: #111;
    border-bottom: 1px solid #292929;
    padding: 24px 15px;
    text-align: center;
}

.header h1 {
    margin: 0;
    font-size: 23px;
    color: white;
}

.header p {
    color: #999;
    font-size: 13px;
    margin: 8px 0 0;
}

.container {
    max-width: 680px;
    margin: 25px auto;
    padding: 0 13px;
}

.box {
    background: #151515;
    border: 1px solid #303030;
    border-radius: 20px;
    padding: 19px;
    margin-bottom: 20px;
}

label {
    display: block;
    color: #ccc;
    font-size: 14px;
    margin-bottom: 10px;
}

select, textarea {
    width: 100%;
    background: #080808;
    color: white;
    border: 1px solid #414141;
    border-radius: 13px;
    padding: 14px;
    font-size: 15px;
    outline: none;
    font-family: Arial, sans-serif;
}

select {
    height: 52px;
    margin-bottom: 22px;
}

textarea {
    height: 145px;
    resize: vertical;
    line-height: 1.6;
}

.info {
    color: #999;
    font-size: 13px;
    line-height: 1.5;
    margin: 12px 0 18px;
}

button {
    cursor: pointer;
    border: none;
    font-family: Arial, sans-serif;
}

.track-btn {
    width: 100%;
    background: white;
    color: black;
    border-radius: 13px;
    padding: 17px;
    font-size: 16px;
    font-weight: bold;
}

.track-btn:disabled {
    opacity: .6;
    cursor: wait;
}

.result-box {
    background: #151515;
    border: 1px solid #303030;
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 18px;
}

.result-card {
    border: 1px solid #333;
    border-radius: 17px;
    padding: 18px;
}

.result-card h3 {
    margin: 3px 0 20px;
    font-size: 17px;
}

.row {
    display: flex;
    justify-content: space-between;
    gap: 15px;
    padding: 12px 0;
    border-bottom: 1px solid #292929;
    font-size: 14px;
    line-height: 1.5;
}

.row .name {
    color: #999;
    min-width: 105px;
}

.row .value {
    color: white;
    text-align: right;
    overflow-wrap: anywhere;
}

.status {
    color: #bdbdbd !important;
    font-weight: bold;
}

.history-btn {
    width: 100%;
    margin-top: 17px;
    padding: 15px;
    background: #252525;
    color: white;
    border-radius: 11px;
    font-size: 14px;
    font-weight: bold;
}

.history {
    display: none;
    margin-top: 18px;
}

.history-item {
    border-left: 3px solid #888;
    padding: 3px 0 15px 15px;
    margin-left: 7px;
    margin-bottom: 5px;
}

.history-date {
    color: white;
    font-size: 14px;
    font-weight: bold;
    margin-bottom: 9px;
}

.history-desc {
    color: #bbb;
    font-size: 14px;
    line-height: 1.5;
}

.error {
    color: #ff7777;
    font-size: 14px;
    padding: 10px 0;
}

.loading {
    color: #bbb;
    text-align: center;
    padding: 15px;
    font-size: 14px;
}

.footer {
    text-align: center;
    color: #666;
    font-size: 13px;
    padding: 25px 10px 35px;
}
</style></head><body><div class="header">
    <h1>LACAK PAKET</h1>
    <p>Pelacakan Paket SiCepat Express</p>
</div><div class="container"><div class="box">

    <label>Ekspedisi</label>
    <select id="courier">
        <option value="sicepat">SiCepat Express</option>
    </select>

    <label>Masukkan Nomor Resi</label>
    <textarea id="resi" placeholder="Masukkan nomor resi, satu resi setiap baris"></textarea>

    <div class="info">
        Maksimal 55 nomor resi. Pisahkan setiap resi dengan baris baru.
    </div>

    <button class="track-btn" id="trackBtn" onclick="lacakPaket()">
        LACAK PAKET
    </button>

</div>

<div id="hasil"></div>

</div><div class="footer">
    Pelacakan Paket SiCepat Express
</div><script>
const WORKER_URL = "https://lacakpeket.anddo2336.workers.dev";

async function lacakPaket() {

    const input = document.getElementById("resi").value;

    const resiList = [...new Set(
        input.split(/[\n,;]+/)
        .map(item => item.trim())
        .filter(item => item !== "")
    )];

    const hasil = document.getElementById("hasil");
    const tombol = document.getElementById("trackBtn");

    if (resiList.length === 0) {
        alert("Masukkan nomor resi terlebih dahulu.");
        return;
    }

    if (resiList.length > 55) {
        alert("Maksimal hanya 55 nomor resi.");
        return;
    }

    hasil.innerHTML = "";
    tombol.disabled = true;
    tombol.textContent = "SEDANG MELACAK...";

    for (let i = 0; i < resiList.length; i++) {

        const resi = resiList[i];

        const box = document.createElement("div");
        box.className = "result-box";
        box.innerHTML = `
            <div class="result-card">
                <h3>DETAIL PAKET #${i + 1}</h3>
                <div class="loading">Sedang mengambil data paket...</div>
            </div>
        `;

        hasil.appendChild(box);

        try {

            const url = WORKER_URL +
                "/api/track?resi=" + encodeURIComponent(resi);

            const response = await fetch(url);
            const result = await response.json();

            if (!response.ok || !result.data) {
                throw new Error(result.message || "Data pelacakan tidak ditemukan");
            }

            const data = result.data || {};
            const summary = data.summary || {};
            const detail = data.detail || {};

            // Mengambil data sesuai struktur JSON BinderByte
            const namaPenerima = detail.receiver || "-";
            const alamat = detail.destination || "-";
            const nomorResi = summary.awb || resi;
            const seller = detail.shipper || "-";
            const status = summary.status || "-";

            const riwayat = Array.isArray(data.history)
                ? data.history
                : [];

            let historyHTML = "";

            if (riwayat.length > 0) {

                historyHTML = riwayat.map(item => `
                    <div class="history-item">
                        <div class="history-date">
                            ${escapeHTML(item.date || "-")}
                        </div>
                        <div class="history-desc">
                            ${escapeHTML(item.desc || "-")}
                            ${item.location ? "<br>" + escapeHTML(item.location) : ""}
                        </div>
                    </div>
                `).join("");

            } else {
                historyHTML = '<p class="history-desc">Belum ada riwayat perjalanan.</p>';
            }

            box.innerHTML = `
                <div class="result-card">

                    <h3>DETAIL PAKET #${i + 1}</h3>

                    <div class="row">
                        <span class="name">Nama Penerima</span>
                        <span class="value">${escapeHTML(namaPenerima)}</span>
                    </div>

                    <div class="row">
                        <span class="name">Alamat</span>
                        <span class="value">${escapeHTML(alamat)}</span>
                    </div>

                    <div class="row">
                        <span class="name">No Resi</span>
                        <span class="value">${escapeHTML(nomorResi)}</span>
                    </div>

                    <div class="row">
                        <span class="name">Seller</span>
                        <span class="value">${escapeHTML(seller)}</span>
                    </div>

                    <div class="row">
                        <span class="name">Status</span>
                        <span class="value status">${escapeHTML(status)}</span>
                    </div>

                    <button class="history-btn" type="button">
                        LIHAT RIWAYAT PERJALANAN
                    </button>

                    <div class="history">
                        ${historyHTML}
                    </div>

                </div>
            `;

            const historyButton = box.querySelector(".history-btn");
            const historyContent = box.querySelector(".history");

            historyButton.addEventListener("click", () => {
                const terbuka = historyContent.style.display === "block";

                historyContent.style.display = terbuka ? "none" : "block";

                historyButton.textContent = terbuka
                    ? "LIHAT RIWAYAT PERJALANAN"
                    : "SEMBUNYIKAN RIWAYAT";
            });

        } catch (error) {

            box.innerHTML = `
                <div class="result-card">
                    <h3>DETAIL PAKET #${i + 1}</h3>

                    <div class="row">
                        <span class="name">No Resi</span>
                        <span class="value">${escapeHTML(resi)}</span>
                    </div>

                    <div class="error">
                        Gagal: ${escapeHTML(error.message)}
                    </div>
                </div>
            `;
        }
    }

    tombol.disabled = false;
    tombol.textContent = "LACAK PAKET";
}

function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    })[char]);
}
</script></body>
</html>
